name: Bug report
description: Report a reproducible Chores Manager integration problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I am using the latest released version of Chores Manager.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed tokens, private URLs, names, and other household data.
          required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.0
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Chores Manager version
      placeholder: 0.6.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include only sanitized Chores Manager or Home Assistant errors.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized configuration or screenshots when useful.
