name: Home Assistant compatibility

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

cache-mode: read

concurrency:
  group: home-assistant-compatibility
  cancel-in-progress: true

jobs:
  resolve-releases:
    name: Resolve Home Assistant releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
    steps:
      - name: Resolve stable and beta releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases_file="$(mktemp)"
          gh api "repos/home-assistant/core/releases?per_page=100" > "${releases_file}"
          python - "${releases_file}" <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          releases = json.load(open(sys.argv[1], encoding="utf-8"))
          releases = [release for release in releases if not release["draft"]]
          stable = next(
              (release for release in releases if not release["prerelease"]),
              None,
          )
          if stable is None:
              raise SystemExit("No stable Home Assistant release found")

          def version(tag):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:b(\d+))?", tag)
              if match is None:
                  raise ValueError(f"Unsupported Home Assistant release tag: {tag}")
              year, month, patch, beta_number = match.groups()
              return int(year), int(month), int(patch), int(beta_number or -1)

          stable_version = version(stable["tag_name"])

          def is_published_to_pypi(tag):
              try:
                  with urlopen(
                      f"https://pypi.org/pypi/homeassistant/{tag}/json",
                      timeout=10,
                  ) as response:
                      return response.status == 200
              except HTTPError as error:
                  if error.code == 404:
                      return False
                  raise
              except URLError as error:
                  raise SystemExit(
                      f"Could not verify whether Home Assistant {tag} is on PyPI: "
                      f"{error.reason}"
                  ) from error

          if not is_published_to_pypi(stable["tag_name"]):
              raise SystemExit(
                  f"Latest stable Home Assistant release {stable['tag_name']} is not on PyPI"
              )

          beta = next(
              (
                  release
                  for release in releases
                  if release["prerelease"]
                  and version(release["tag_name"])[:2] > stable_version[:2]
              ),
              None,
          )
          include = [{"channel": "stable", "ref": stable["tag_name"]}]
          if beta is not None and is_published_to_pypi(beta["tag_name"]):
              include.append({"channel": "beta", "ref": beta["tag_name"]})
          elif beta is not None:
              print(
                  f"Skipping Home Assistant beta {beta['tag_name']}: it is not published to PyPI"
              )

          matrix = json.dumps({"include": include}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={matrix}\n")
          labels = " and ".join(
              f"{release['channel']} {release['ref']}" for release in include
          )
          print(f"Testing Home Assistant {labels}")
          PY

  validate:
    name: Core ${{ matrix.channel }} (${{ matrix.ref }})
    needs: resolve-releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-releases.outputs.matrix) }}
    steps:
      - name: Check out Chores Manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: integration
          persist-credentials: false

      - name: Check out Home Assistant Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/core
          ref: ${{ matrix.ref }}
          path: core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install compatibility test environment
        working-directory: core
        run: |
          uv venv .venv --python "${pythonLocation}/bin/python"
          . .venv/bin/activate
          uv pip install -r requirements.txt
          uv pip install -r requirements_all.txt -r requirements_test.txt
          uv pip install -e . -e packages/pytest-homeassistant

      - name: Run full backend test suite
        working-directory: core
        run: |
          mkdir -p custom_components
          cp -a ../integration/custom_components/chores_manager custom_components/
          cp -a ../integration/tests/components/chores_manager tests/components/
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "from tests.common import": "from pytest_homeassistant.common import",
              "from tests.typing import": "from pytest_homeassistant.typing import",
          }
          for path in Path("tests/components/chores_manager").glob("*.py"):
              source = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  source = source.replace(old, new)
              path.write_text(source, encoding="utf-8")
          PY
          . .venv/bin/activate
          pytest -q --asyncio-mode=auto tests/components/chores_manager
